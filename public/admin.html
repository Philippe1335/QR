<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Restaurant Pay — Tables</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap" style="max-width: 780px;">
    <header class="site">
      <h1>🍽️ QR Restaurant Pay</h1>
      <div class="sub">Imprimez le QR code de chaque table — vos clients le scannent pour voir et payer leur addition.</div>
    </header>

    <div class="no-print" style="text-align:center; margin-top: 12px;">
      <button class="btn primary" style="max-width: 240px; display:inline-block;" onclick="window.print()">🖨️ Imprimer les QR codes</button>
    </div>

    <div class="tables-grid" id="tables"></div>
  </div>

  <script>
    const fmt = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });

    async function load() {
      const res = await fetch('/api/tables');
      const tables = await res.json();
      const grid = document.getElementById('tables');
      grid.innerHTML = '';
      for (const t of tables) {
        const card = document.createElement('div');
        card.className = 'table-card';

        const img = document.createElement('img');
        img.src = `/qr/${t.tableId}.png`;
        img.alt = `QR code table ${t.tableId}`;

        const h3 = document.createElement('h3');
        h3.textContent = `Table ${t.tableId}`;

        const amount = document.createElement('div');
        amount.className = 'amount';
        amount.textContent = t.settled
          ? '✅ Addition réglée'
          : `Addition : ${fmt.format(t.total / 100)} — restant ${fmt.format(t.remaining / 100)}`;

        const link = document.createElement('a');
        link.className = 'open no-print';
        link.href = `/table/${t.tableId}`;
        link.textContent = 'Ouvrir la page client →';

        card.append(img, h3, amount, link);
        grid.appendChild(card);
      }
    }

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
